apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tic-tac-toe.fullname" . }}
  labels:
    {{- include "tic-tac-toe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tic-tac-toe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tic-tac-toe.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "tic-tac-toe.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: {{ include "tic-tac-toe.fullname" . }}-config
            - secretRef:
                name: {{ include "tic-tac-toe.fullname" . }}-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - cat
                - tic_tac_toe.py
          readinessProbe:
            exec:
              command:
                - cat
                - tic_tac_toe.py
